<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тренажёр Реакции</title>
    <!-- Обязательный скрипт для работы Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #e0e0e0);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
        }
        #reaction-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }
        #reaction-button.ready {
            background-color: #4CAF50;
        }
        #reaction-button:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 20px;
            font-size: 24px;
            height: 30px;
        }
        #leaderboard {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Тренажёр Реакции</h1>
        <p>Нажми на кнопку, когда она станет зелёной!</p>
        <button id="reaction-button">ЖДИ...</button>
        <div id="result"></div>
        <div id="leaderboard"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.ready();  // Сообщаем, что приложение готово

        const button = document.getElementById('reaction-button');
        const resultDiv = document.getElementById('result');
        const leaderboardDiv = document.getElementById('leaderboard');

        let gameState = 'waiting'; // 'waiting', 'ready', 'finished'
        let startTime;

        // Запуск раунда по клику на кнопку
        button.addEventListener('click', () => {
            if (gameState === 'waiting') {
                startRound();
            } else if (gameState === 'ready') {
                // Игрок нажал слишком рано
                endRound("Слишком рано! Подожди зелёного цвета.");
            }
        });

        function startRound() {
            gameState = 'waiting';
            button.textContent = 'ЖДИ...';
            button.classList.remove('ready');
            resultDiv.textContent = '';
            
            // Случайная задержка от 1.5 до 5 секунд
            const delay = Math.random() * (5000 - 1500) + 1500;
            
            setTimeout(() => {
                if (gameState === 'waiting') {
                    gameState = 'ready';
                    button.textContent = 'ЖМИ!';
                    button.classList.add('ready');
                    startTime = performance.now(); // Точное время старта
                }
            }, delay);
        }

        function endRound(message) {
            gameState = 'finished';
            button.textContent = 'ЕЩЁ РАЗ';
            button.classList.remove('ready');
            
            if (message) {
                resultDiv.textContent = message;
            } else {
                const reactionTime = (performance.now() - startTime) / 1000;
                resultDiv.textContent = `Твоё время: ${reactionTime.toFixed(3)} сек.`;
                
                // Отправляем результат в бота
                sendResultToBot(reactionTime);
            }

            // Сбрасываем состояние, чтобы можно было начать заново
            button.onclick = () => {
                gameState = 'waiting';
                startRound();
            };
        }

        // Функция для отправки данных в вашего Python-бота
        function sendResultToBot(time) {
            const data = {
                action: "save_result",
                reaction_time: time
            };
            // Отправляем JSON-строку боту
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
